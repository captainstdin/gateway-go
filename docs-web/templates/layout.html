<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - GatewayWorker-Go 文档</title>
    <link rel="stylesheet" href="{{.ResourcePrefix}}github-markdown.css">
    <link rel="stylesheet" href="{{.ResourcePrefix}}chroma.css">
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-sidebar: #f6f8fa;
            --bg-sidebar-hover: #eaf0f6;
            --border-color: #d0d7de;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --link-color: #0969da;
            --active-bg: #0969da;
            --active-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0d1117;
                --bg-sidebar: #161b22;
                --bg-sidebar-hover: #21262d;
                --border-color: #30363d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --link-color: #58a6ff;
                --active-bg: #1f6feb;
                --active-text: #ffffff;
            }
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: var(--bg-body);
            color: var(--text-primary);
            color-scheme: light dark;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            position: fixed;
            top: 0;
            left: 0;
            box-sizing: border-box;
        }
        .sidebar h3 {
            margin-top: 1.2em;
            margin-bottom: 0.4em;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .sidebar h3 a {
            color: inherit;
            text-decoration: none;
        }
        .sidebar h3 a:hover {
            color: var(--link-color);
        }
        .sidebar h3:first-child { margin-top: 0; }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            margin-bottom: 4px;
        }
        .sidebar a {
            text-decoration: none;
            color: var(--link-color);
            font-size: 14px;
            display: block;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .sidebar a:hover {
            background-color: var(--bg-sidebar-hover);
        }
        .sidebar a.active {
            background-color: var(--active-bg);
            color: var(--active-text) !important;
            font-weight: 500;
        }
        .sidebar a.active:hover {
            background-color: var(--active-bg);
            text-decoration: none;
        }
        .content {
            margin-left: 250px;
            padding: 24px 32px;
            box-sizing: border-box;
        }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 1024px;
            margin: 0 auto;
        }
        @media (max-width: 767px) {
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border-color); }
            .content { margin-left: 0; padding: 15px; }
            .markdown-body { padding: 0; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        {{.NavHTML}}
    </div>
    <div class="content">
        <div class="markdown-body">
            {{.Content}}
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var links = document.querySelectorAll('.sidebar a');
            var currentUrl = window.location.href.split('#')[0]; // Ignore hash for matching
            links.forEach(function(link) {
                var linkUrl = link.href.split('#')[0];
                if (linkUrl === currentUrl || (currentUrl.endsWith('/') && linkUrl.endsWith('/index.html'))) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
